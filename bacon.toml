# Bacon merges this file with its built-in jobs, so only the jobs that need
# `--workspace` are overridden. That way every job covers both crates, wherever
# bacon is started from.

[jobs.check]
command = ["cargo", "check", "--workspace"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace"]
need_stdout = false

[jobs.clippy-all]
command = ["cargo", "clippy", "--workspace", "--all-targets"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.doc]
command = ["cargo", "doc", "--workspace", "--no-deps"]
need_stdout = false
